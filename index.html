<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg" href="favicon.svg" />
    <title>Стикосы | by DVegasa</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .noselect {
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Safari */
        -khtml-user-select: none; /* Konqueror HTML */
        -moz-user-select: none; /* Old versions of Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently
                                  supported by Chrome, Edge, Opera and Firefox */
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #1a1a1a;
        color: #e0e0e0;
        min-height: 100vh;
        width: 100%;
      }
      h1 {
        text-align: center;
        margin-bottom: 2rem;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      #sections {
        display: flex;
        gap: 2rem;
      }
      .column {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .section {
        min-width: 0;
      }
      .section h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        letter-spacing: 0.03em;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, 100px);
        gap: 8px;
        width: 100%;
        justify-content: start;
      }
      .cell {
        position: relative;
        width: 100px;
        height: 100px;
        padding: 4px;
        /* background: #2a2a2a; */
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
        z-index: 1;
      }
      .cell:hover {
        background: #252525;
        transform: scale(1.75);
        z-index: 5;
      }
      .cell:active {
        z-index: 5;
        transform: scale(0.98);
      }
      .cell img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      .cell-star {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffc107;
        pointer-events: none;
      }
      .cell-star:not(.show) {
        display: none;
      }
      .cell-star svg {
        width: 16px;
        height: 16px;
      }
      #favorites-section {
        width: 100%;
        margin-bottom: 2rem;
        min-width: 0;
      }
      #favorites-section h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        letter-spacing: 0.03em;
      }
      #favorites-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-content: flex-start;
      }
      #favorites-gallery .cell {
        flex-shrink: 0;
      }
      #favorites-empty {
        color: #888;
        font-size: 0.95rem;
        margin: 0;
        height: 100px;
        padding-top: 8px;
      }
      .toast {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%) translateY(-80px);
        background: #00ed5f;
        color: #000000;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        opacity: 0;
        transition: transform 0.25s, opacity 0.25s;
        z-index: 1000;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
      .by {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px 4px;
        font-weight: 500;
        background-color: #131313;
      }
      .by a {
        text-decoration: none;
        color: unset;
      }
      .by a:hover {
        text-decoration: underline;
        color: unset;
      }

      @media (max-width: 1100px) {
        #sections {
          flex-direction: column;
        }
      }

      .opensource {
        position: absolute;
        top: 0;
        right: 0;
        padding: 4px 4px;
      }
      .opensource a {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <section id="favorites-section" class="section noselect">
      <h2>Избранное</h2>
      <p id="favorites-empty" class="noselect">
        Вы можете добавить стикер в избранное, нажав по нему правой кнопкой мыши
      </p>
      <div id="favorites-gallery" class="gallery"></div>
    </section>
    <div id="sections" class="noselect"></div>
    <div class="toast noselect" id="toast">Скопировано!</div>
    <div class="by noselect">
      by&nbsp;<a href="https://dvegasa.ru">DVegasa</a>&nbsp;with ❤️
      <div class="opensource">
        <a
          href="https://github.com/dvegasa2/dvegasa2.github.io"
          target="_blank"
        >
          Как добавить свои стикеры?</a
        >
      </div>
    </div>

    <script>
      const BASE_URL = "https://s.dvegasa.ru";
      const FAVORITES_KEY = "sticker-favorites";

      function getFavorites() {
        try {
          const raw = localStorage.getItem(FAVORITES_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch {
          return [];
        }
      }
      function setFavorites(arr) {
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(arr));
      }
      function isFavorited(key) {
        return getFavorites().includes(key);
      }
      function toggleFavorite(key) {
        const fav = getFavorites();
        const i = fav.indexOf(key);
        if (i >= 0) fav.splice(i, 1);
        else fav.push(key);
        setFavorites(fav);
      }

      const starSvg =
        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';

      function createStickerCell(folder, filename, ext, inFavoritesSection) {
        const key = `${folder}/${filename}`;
        const src = `${BASE_URL}/${folder}/${filename}`;
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.stickerKey = key;
        cell.title = "Нажмите — скопировать URL. Правый клик — в избранное.";
        cell.innerHTML = `<img src="${folder}/${filename}" alt="Стикер" loading="lazy">`;

        const star = document.createElement("div");
        star.className = "cell-star";
        star.innerHTML = starSvg;
        if (isFavorited(key) || inFavoritesSection) star.classList.add("show");
        cell.appendChild(star);

        cell.addEventListener("click", (e) => {
          if (e.button !== 0) return;
          copyUrl(src);
        });
        cell.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          toggleFavorite(key);
          star.classList.toggle("show", isFavorited(key));
          if (inFavoritesSection) cell.remove();
          renderFavorites();
        });

        return cell;
      }

      function renderFavorites() {
        const gallery = document.getElementById("favorites-gallery");
        const emptyEl = document.getElementById("favorites-empty");
        if (!gallery || !emptyEl) return;
        gallery.innerHTML = "";
        getFavorites().forEach((key) => {
          const [folder, filename] = key.split("/");
          if (!folder || !filename) return;
          gallery.appendChild(createStickerCell(folder, filename, null, true));
        });
        emptyEl.style.display =
          gallery.children.length === 0 ? "block" : "none";

        document
          .querySelectorAll("#sections .cell[data-sticker-key]")
          .forEach((cell) => {
            const star = cell.querySelector(".cell-star");
            if (star)
              star.classList.toggle(
                "show",
                isFavorited(cell.dataset.stickerKey)
              );
          });
      }

      // folder — папка со стикерами, title — название раздела, count — количество файлов (1.ext, 2.ext, …), ext — расширение (по умолчанию "png")
      const SECTIONS = [
        { folder: "cto", title: "CTO in rage", count: 43, ext: "png" },
        {
          folder: "ebanyfrontend",
          title: "ebanyfrontend",
          count: 22,
          ext: "png",
        },
        {
          folder: "conversationlist",
          title: "Я интересный собеседник",
          count: 14,
          ext: "png",
        },
        { folder: "corrections", title: "Правки", count: 33, ext: "png" },
        { folder: "codebark", title: "Корги-кодеры", count: 27, ext: "png" },
        { folder: "gotcha", title: "Поймай меня!", count: 14, ext: "png" },
      ];

      const container = document.getElementById("sections");
      const toast = document.getElementById("toast");

      function showToast() {
        toast.classList.add("show");
        clearTimeout(showToast.t);
        showToast.t = setTimeout(() => toast.classList.remove("show"), 1500);
      }

      function copyUrl(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(showToast).catch(fallback);
        } else {
          fallback();
        }
        function fallback() {
          const input = document.createElement("input");
          input.value = url;
          document.body.appendChild(input);
          input.select();
          document.execCommand("copy");
          document.body.removeChild(input);
          showToast();
        }
      }

      function buildGallery(folder, count, ext = "png") {
        const gallery = document.createElement("div");
        gallery.className = "gallery";
        for (let i = 1; i <= count; i++) {
          const filename = `${i}.${ext}`;
          gallery.appendChild(createStickerCell(folder, filename, ext, false));
        }
        return gallery;
      }

      const column1 = document.createElement("div");
      column1.className = "column";
      const column2 = document.createElement("div");
      column2.className = "column";

      SECTIONS.forEach(({ folder, title, count, ext = "png" }, index) => {
        const section = document.createElement("section");
        section.className = "section";
        section.innerHTML = `<h2>${title}</h2>`;
        section.appendChild(buildGallery(folder, count, ext));
        (index % 2 === 0 ? column1 : column2).appendChild(section);
      });

      container.appendChild(column1);
      container.appendChild(column2);

      renderFavorites();
    </script>
  </body>
</html>
