<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg" href="favicon.svg" />
    <title>Стикосы | by DVegasa</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .noselect {
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Safari */
        -khtml-user-select: none; /* Konqueror HTML */
        -moz-user-select: none; /* Old versions of Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently
                                  supported by Chrome, Edge, Opera and Firefox */
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #1a1a1a;
        color: #e0e0e0;
        min-height: 100vh;
        width: 100%;
      }
      h1 {
        text-align: center;
        margin-bottom: 2rem;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      #sections {
        display: flex;
        gap: 2rem;
      }
      .column {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .section {
        min-width: 0;
      }
      .section h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        letter-spacing: 0.03em;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, 100px);
        gap: 8px;
        width: 100%;
        justify-content: start;
      }
      .cell {
        width: 100px;
        height: 100px;
        padding: 4px;
        /* background: #2a2a2a; */
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      .cell:hover {
        background: #3a3a3a;
        transform: scale(1.75);
      }
      .cell:active {
        transform: scale(0.98);
      }
      .cell img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      .toast {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%) translateY(-80px);
        background: #00ed5f;
        color: #000000;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        opacity: 0;
        transition: transform 0.25s, opacity 0.25s;
        z-index: 1000;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
      .by {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px 4px;
        font-weight: 500;
        background-color: #131313;
      }
      .by a {
        text-decoration: none;
        color: unset;
      }
      .by a:hover {
        text-decoration: underline;
        color: unset;
      }

      @media (max-width: 1100px) {
        #sections {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="sections" class="noselect"></div>
    <div class="toast noselect" id="toast">Скопировано!</div>
    <div class="by noselect">
      by&nbsp;<a href="https://dvegasa.ru">DVegasa</a>&nbsp;with ❤️
    </div>

    <script>
      const BASE_URL = "https://s.dvegasa.ru";

      // folder — папка со стикерами, title — название раздела, count — количество файлов (1.ext, 2.ext, …), ext — расширение (по умолчанию "png")
      const SECTIONS = [
        { folder: "cto", title: "CTO in rage", count: 43, ext: "png" },
        {
          folder: "ebanyfrontend",
          title: "ebanyfrontend",
          count: 22,
          ext: "png",
        },
        {
          folder: "conversationlist",
          title: "Я интересный собеседник",
          count: 14,
          ext: "png",
        },
        { folder: "corrections", title: "Правки", count: 33, ext: "png" },
        { folder: "codebark", title: "Корги-кодеры", count: 27, ext: "png" },
        { folder: "gotcha", title: "Поймай меня!", count: 14, ext: "png" },
      ];

      const container = document.getElementById("sections");
      const toast = document.getElementById("toast");

      function showToast() {
        toast.classList.add("show");
        clearTimeout(showToast.t);
        showToast.t = setTimeout(() => toast.classList.remove("show"), 1500);
      }

      function copyUrl(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(showToast).catch(fallback);
        } else {
          fallback();
        }
        function fallback() {
          const input = document.createElement("input");
          input.value = url;
          document.body.appendChild(input);
          input.select();
          document.execCommand("copy");
          document.body.removeChild(input);
          showToast();
        }
      }

      function buildGallery(folder, count, ext = "png") {
        const gallery = document.createElement("div");
        gallery.className = "gallery";
        const baseUrl = `${BASE_URL}/${folder}`;
        for (let i = 1; i <= count; i++) {
          const filename = `${i}.${ext}`;
          const src = `${baseUrl}/${filename}`;
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.title = "Нажмите, чтобы скопировать URL";
          cell.innerHTML = `<img src="${folder}/${filename}" alt="Стикер ${i}" loading="lazy">`;
          cell.addEventListener("click", () => copyUrl(src));
          gallery.appendChild(cell);
        }
        return gallery;
      }

      const column1 = document.createElement("div");
      column1.className = "column";
      const column2 = document.createElement("div");
      column2.className = "column";

      SECTIONS.forEach(({ folder, title, count, ext = "png" }, index) => {
        const section = document.createElement("section");
        section.className = "section";
        section.innerHTML = `<h2>${title}</h2>`;
        section.appendChild(buildGallery(folder, count, ext));
        (index % 2 === 0 ? column1 : column2).appendChild(section);
      });

      container.appendChild(column1);
      container.appendChild(column2);
    </script>
  </body>
</html>
