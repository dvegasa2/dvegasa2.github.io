<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #1a1a1a;
        color: #e0e0e0;
        min-height: 100vh;
        width: 100%;
      }
      h1 {
        text-align: center;
        margin-bottom: 2rem;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      #sections {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }
      .section {
        min-width: 0;
      }
      .section h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        letter-spacing: 0.03em;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, 100px);
        gap: 8px;
        width: 100%;
        justify-content: start;
      }
      .cell {
        width: 100px;
        height: 100px;
        padding: 4px;
        background: #2a2a2a;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      .cell:hover {
        background: #3a3a3a;
        transform: scale(1.75);
      }
      .cell:active {
        transform: scale(0.98);
      }
      .cell img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: #333;
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        opacity: 0;
        transition: transform 0.25s, opacity 0.25s;
        z-index: 1000;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="sections"></div>
    <div class="toast" id="toast">Скопировано!</div>

    <script>
      const BASE_URL = "https://dvegasa2.github.io";

      // Папка со стикерами → название раздела на странице; count — количество файлов (1.png, 2.png, …)
      const SECTIONS = [
        { folder: "cto", title: "CTO in rage", count: 43 },
        { folder: "ebanyfrontend", title: "ebanyfrontend", count: 22 },
        {
          folder: "conversationlist",
          title: "Я интересный собеседник",
          count: 14,
        },
      ];

      const container = document.getElementById("sections");
      const toast = document.getElementById("toast");

      function showToast() {
        toast.classList.add("show");
        clearTimeout(showToast.t);
        showToast.t = setTimeout(() => toast.classList.remove("show"), 1500);
      }

      function copyUrl(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(showToast).catch(fallback);
        } else {
          fallback();
        }
        function fallback() {
          const input = document.createElement("input");
          input.value = url;
          document.body.appendChild(input);
          input.select();
          document.execCommand("copy");
          document.body.removeChild(input);
          showToast();
        }
      }

      function buildGallery(folder, count) {
        const gallery = document.createElement("div");
        gallery.className = "gallery";
        const baseUrl = `${BASE_URL}/${folder}`;
        for (let i = 1; i <= count; i++) {
          const src = `${baseUrl}/${i}.png`;
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.title = "Нажмите, чтобы скопировать URL";
          cell.innerHTML = `<img src="${folder}/${i}.png" alt="Стикер ${i}" loading="lazy">`;
          cell.addEventListener("click", () => copyUrl(src));
          gallery.appendChild(cell);
        }
        return gallery;
      }

      SECTIONS.forEach(({ folder, title, count }) => {
        const section = document.createElement("section");
        section.className = "section";
        section.innerHTML = `<h2>${title}</h2>`;
        section.appendChild(buildGallery(folder, count));
        container.appendChild(section);
      });
    </script>
  </body>
</html>
